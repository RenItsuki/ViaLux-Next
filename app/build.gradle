plugins {
    id "com.android.application"
}

android {
    namespace "com.visionguide.phone"
    compileSdk 36

    defaultConfig {
        applicationId "com.visionguide.phone"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "2.0"

        ndk {
            abiFilters "arm64-v8a"
        }
        def localProps = new Properties()
        def localPropsFile = rootProject.file('local.properties')
        if (localPropsFile.exists()) {
            localProps.load(localPropsFile.newDataInputStream())
        }
        def mapsKey = localProps.getProperty('MAPS_API_KEY', '')
        manifestPlaceholders = [MAPS_API_KEY: mapsKey]
        buildConfigField "String", "MAPS_API_KEY", "\"${mapsKey}\""

        def geminiKey = localProps.getProperty('GEMINI_API_KEY', '')
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiKey}\""
    }

    aaptOptions {
        noCompress "onnx"
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    def cameraxVersion = "1.6.0"

    // AndroidX core
    implementation "androidx.appcompat:appcompat:1.7.1"

    // CameraX
    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"

    // ONNX Runtime (general-purpose YOLO model)
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.26.0"

    // ML Kit OCR (on-device, no API key required)
    implementation "com.google.mlkit:text-recognition:16.0.1"

    // Jetpack Security (EncryptedSharedPreferences for NFC medicine store)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Google Maps SDK + Location (navigation)
    implementation "com.google.android.gms:play-services-maps:19.2.0"
    implementation "com.google.android.gms:play-services-location:21.3.0"

    // HTTP client for Gemini API and Roboflow online inference
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}

